version: 2
updates:
  # ── Python dependencies (pyproject.toml) ────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      python-deps:
        patterns: ["*"]   # one grouped PR instead of many
    ignore:
      # Major bumps of the heavy ML stack can break inference — review manually.
      - dependency-name: "torch"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ultralytics"
        update-types: ["version-update:semver-major"]
      - dependency-name: "onnxruntime"
        update-types: ["version-update:semver-major"]

  # ── GitHub Actions in workflows ─────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
