name: CI

on:
  push:
    branches: ["master", "main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["master", "main"]

jobs:

  # ── Lint (ruff) ─────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        run: ruff check .

  # ── Unit tests (fast, mocked) ───────────────────────────────────────────────
  test-unit:
    name: Unit tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: >
          pytest
          tests/test_auth.py
          tests/test_config.py
          tests/test_imaging.py
          tests/test_file_browser.py
          tests/test_monitor.py
          tests/test_veyon.py
          --tb=short -q

  # ── DB tests (real SQLite, no mocks) ────────────────────────────────────────
  test-db:
    name: DB tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run DB tests
        run: pytest tests/test_database.py --tb=short -q

  # ── Build (only after both test jobs pass) ───────────────────────────────────
  build:
    name: Build Windows executable
    needs: [test-unit, test-db]
    runs-on: windows-latest
    permissions:
      contents: write   # required for softprops/action-gh-release to create the Release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -e ".[dev,build]"

      - name: Build exe
        run: python build.py

      - name: Zip release assets
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          New-Item -ItemType Directory -Force -Path dist/weights | Out-Null
          New-Item -ItemType Directory -Force -Path dist/data    | Out-Null
          Compress-Archive -Path dist/VeyonAIMonitor.exe, dist/weights, dist/data `
            -DestinationPath dist/VeyonAIMonitor-${{ github.ref_name }}-windows.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Veyon AI Monitor ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/VeyonAIMonitor-${{ github.ref_name }}-windows.zip

      - name: Upload artifact (non-release builds)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: VeyonAIMonitor-${{ github.sha }}
          path: |
            dist/VeyonAIMonitor.exe
            dist/weights/
            dist/data/
          retention-days: 14
