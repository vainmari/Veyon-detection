[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veyon-ai-monitor"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "nicegui>=1.4",
    "requests>=2.31",
    "ultralytics>=8.2",
    "opencv-python-headless>=4.9",
    "Pillow>=10.3",
    "numpy>=1.26",
    "torch>=2.2",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "bcrypt>=4.0",
    "python-dotenv>=1.0",
    "keyring>=24.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
]
build = [
    "pyinstaller>=6.0",
]
