name: CI

on:
  push:
    branches: ["master", "main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["master", "main"]

jobs:

  # ── Lint (ruff) ─────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        run: ruff check .

  # ── Unit tests (fast, mocked) ───────────────────────────────────────────────
  test-unit:
    name: Unit tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/cache@v5
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: >
          pytest
          tests/test_auth.py
          tests/test_config.py
          tests/test_imaging.py
          tests/test_file_browser.py
          tests/test_monitor.py
          tests/test_rate_limit.py
          tests/test_veyon.py
          --tb=short -q

  # ── DB tests (real SQLite, no mocks) ────────────────────────────────────────
  test-db:
    name: DB tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/cache@v5
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run DB tests
        run: >
          pytest
          tests/test_database.py
          tests/test_runs.py
          tests/test_model_classes.py
          --tb=short -q

  # ── Build (only on a version tag, after both test jobs pass) ─────────────────
  # Pushing ordinary commits runs lint + tests only; the executable is built
  # and a Release published exclusively when a v*.*.* tag is pushed.
  build:
    name: Build Windows executable
    needs: [test-unit, test-db]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: write   # required for softprops/action-gh-release to create the Release
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/cache@v5
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -e ".[dev,build]"

      - name: Build exe
        run: python build.py

      - name: Zip release assets
        run: |
          New-Item -ItemType Directory -Force -Path dist/weights | Out-Null
          New-Item -ItemType Directory -Force -Path dist/data    | Out-Null
          Compress-Archive -Path dist/VeyonAIMonitor.exe, dist/weights, dist/data `
            -DestinationPath dist/VeyonAIMonitor-${{ github.ref_name }}-windows.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "Veyon AI Monitor ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/VeyonAIMonitor-${{ github.ref_name }}-windows.zip
