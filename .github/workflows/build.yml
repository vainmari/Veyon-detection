name: Test & Build

on:
  push:
    branches: ["master", "main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["master", "main"]

jobs:
  test-and-build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -e ".[dev,build]"

      - name: Run tests
        run: pytest --tb=short -q

      - name: Build exe
        run: python build.py

      - name: Zip release assets
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          New-Item -ItemType Directory -Force -Path dist/weights | Out-Null
          New-Item -ItemType Directory -Force -Path dist/data    | Out-Null
          Compress-Archive -Path dist/VeyonAIMonitor.exe, dist/weights, dist/data `
            -DestinationPath dist/VeyonAIMonitor-${{ github.ref_name }}-windows.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Veyon AI Monitor ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/VeyonAIMonitor-${{ github.ref_name }}-windows.zip

      - name: Upload artifact (non-release builds)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: VeyonAIMonitor-${{ github.sha }}
          path: |
            dist/VeyonAIMonitor.exe
            dist/weights/
            dist/data/
          retention-days: 14
